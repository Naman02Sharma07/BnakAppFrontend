<section class="content-card form-card compact-form">
  <div class="section-header">
    <h2>Withdraw</h2>
  </div>

  <form (ngSubmit)="onSubmit()" class="minimal-form">
    <div class="form-group">
      <label>Account Id</label>
      <input type="number" class="form-control" [(ngModel)]="accountId" name="accountId" required>
    </div>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" class="form-control" [(ngModel)]="amount" name="amount" required>
    </div>

    <button type="submit" class="btn btn-dark mt-3">Submit</button>
  </form>
</section>
