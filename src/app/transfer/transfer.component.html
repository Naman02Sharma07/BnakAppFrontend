<section class="content-card transfer-layout">
  <div class="section-header">
    <h2>Send Money</h2>
    <p>Transfer funds between accounts.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="minimal-form split-form">
    <div class="form-group">
      <label>From Account Id</label>
      <input type="number" class="form-control" [(ngModel)]="fromAccountId" name="fromAccountId" required>
    </div>

    <div class="form-group">
      <label>To Account Id</label>
      <input type="number" class="form-control" [(ngModel)]="toAccountId" name="toAccountId" required>
    </div>

    <div class="form-group full-row">
      <label>Amount</label>
      <input type="number" class="form-control" [(ngModel)]="amount" name="amount" required>
    </div>

    <button type="submit" class="btn btn-dark mt-3">Confirm Transfer</button>
  </form>
</section>
