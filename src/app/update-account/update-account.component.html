<section class="content-card form-card">
  <div class="section-header">
    <h2>Update Account</h2>
    <p class="muted-note">Name and balance are read-only.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="minimal-form split-form">
    <div class="form-group">
      <label>Name</label>
      <input type="text" class="form-control" [(ngModel)]="account.name" name="name" readonly>
    </div>

    <div class="form-group">
      <label>Balance</label>
      <input type="number" class="form-control" [(ngModel)]="account.balance" name="balance" readonly>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="account.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" class="form-control" [(ngModel)]="account.phone" name="phone" required>
    </div>

    <button type="submit" class="btn btn-dark mt-3">Save Changes</button>
  </form>
</section>
