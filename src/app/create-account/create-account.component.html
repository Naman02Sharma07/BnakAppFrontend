<section class="content-card form-card">
  <div class="section-header">
    <h2>Create Account</h2>
  </div>

  <form (ngSubmit)="onSubmit()" class="minimal-form">
    <div class="form-group">
      <label>Name</label>
      <input type="text" class="form-control" [(ngModel)]="account.name" name="name">
    </div>

    <div class="form-group">
      <label>Initial Balance</label>
      <input type="number" class="form-control" [(ngModel)]="account.balance" name="balance">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="account.email" name="email">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" class="form-control" [(ngModel)]="account.phone" name="phone">
    </div>

    <button type="submit" class="btn btn-dark mt-3">Submit</button>
  </form>
</section>
