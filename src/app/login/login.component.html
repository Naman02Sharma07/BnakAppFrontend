<section class="login-layout">
  <div class="login-panel">
    <div class="logo-row">
      <div class="logo-box">B</div>
      <div>
        <h1>BnakApp Bank</h1>
        <p>Login to your account</p>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="minimal-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>

      <div class="text-danger small mt-2" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-dark w-100 mt-3">Login</button>
    </form>
  </div>

  <aside class="login-showcase">
    <div class="card-preview">
      <p>Available Balance</p>
      <h3>$22,124.55</h3>
      <small>Secure digital banking with minimal interface.</small>
    </div>
  </aside>
</section>
